services:
  client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tarih-client
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_API_URL=/api/v1
    env_file:
      - .env
